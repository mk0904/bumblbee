services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bumbl
      POSTGRES_USER: bumbl
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bumbl -d bumbl"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
